# Pull request gate: build, smoke test, scan. This job ("ci") is the required
# status check on master, so Dependabot PRs auto-merge only when it passes.
name: ci

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ansible-vault:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh ansible-vault:ci

      # Scans are informational here: publishing decisions are made by the
      # publish workflow, and alerts live in the Security tab.
      - name: Scan (Trivy, fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ansible-vault:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Scan (Grype, fixable only)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ansible-vault:ci
          fail-build: false
          only-fixed: true
          output-format: table
