# Hands-off dependency updates: every Dependabot PR gets auto-merge enabled.
# GitHub performs the squash merge as soon as the required `ci` check is green
# (branch ruleset on master). The publish workflow then builds and ships a new
# image version if the package set changed.
name: dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
