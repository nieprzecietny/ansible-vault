# Builds the image from master, compares its package set with the published
# `latest`, and publishes a new version only when something inside changed
# (new RHEL packages, new ansible-core, new dependency). Runs daily so RHEL
# errata flow into the image without anyone touching the repo, and on every
# push to master. Scan results go to the Security tab on every run.
name: publish

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the package set is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: nieprzecietnykowalski/ansible-vault
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless signing
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # no-cache: the dnf step must really run so today's RHEL packages land in
      # the image. The layers are exported to a run-scoped cache so the
      # multi-arch push below reuses the amd64 half instead of rebuilding it.
      - name: Build candidate (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          no-cache: true
          tags: ansible-vault:candidate
          cache-to: type=gha,scope=publish-${{ github.run_id }},mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh ansible-vault:candidate

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Compare package set with the published image
        id: diff
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          FORCE: ${{ inputs.force == true }}
        run: scripts/package-diff.sh ansible-vault:candidate "$DOCKERHUB_IMAGE:latest"

      - name: Scan with Grype
        continue-on-error: true
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ansible-vault:candidate
          fail-build: false
          output-format: sarif

      - name: Upload Grype results to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

      - name: Determine version
        id: ver
        run: |
          core="$(docker run --rm ansible-vault:candidate --version | sed -n 's/^ansible-vault \[core \([0-9][0-9.]*\)\].*/\1/p')"
          test -n "$core"
          {
            echo "core=$core"
            echo "minor=${core%.*}"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Image metadata
        if: steps.diff.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=${{ steps.ver.outputs.core }}
            type=raw,value=${{ steps.ver.outputs.core }}-${{ steps.ver.outputs.date }}
          labels: |
            org.opencontainers.image.title=ansible-vault
            org.opencontainers.image.description=ansible-vault CLI only, on a minimal RHEL 10 UBI root filesystem. No package manager, no pip, no editors.
            org.opencontainers.image.version=${{ steps.ver.outputs.core }}-${{ steps.ver.outputs.date }}

      - name: Build and push (linux/amd64, linux/arm64)
        if: steps.diff.outputs.changed == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=publish-${{ github.run_id }}

      - name: Install cosign
        if: steps.diff.outputs.changed == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless, GitHub OIDC)
        if: steps.diff.outputs.changed == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$DOCKERHUB_IMAGE@$DIGEST"
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"

      - name: Summary
        if: steps.diff.outputs.changed == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
